name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          # Repo is served at https://<owner>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Point the built site at your deployed backend API.
          # Update this once the backend is hosted (e.g. Railway/Render).
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api' }}
          # Stamped onto <div class="cm-root" data-build="..."> so the live page
          # can be matched to the commit it was built from.
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "Stamp in built HTML: $(grep -o 'data-build="[^"]*"' out/index.html | head -1)"
          status=0
          while IFS= read -r needle; do
            if grep -qF -- "$needle" out/index.html; then
              echo "ok       $needle"
            else
              echo "MISSING  $needle"
              status=1
            fi
          done <<'NEEDLES'
          .cm-root .cm-form__submit
          /assets/logo/clarus-magnus-logo.png
          .cm-about__para .accent
          .cm-why-mag__shots
          NEEDLES
          exit "$status"

      - name: Add .nojekyll
        run: touch frontend/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
