name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  # Build pull requests too. Without this nothing type-checks a branch before it
  # is merged, so a broken build can only be discovered once it is already on
  # main and the site has stopped updating.
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per ref, so a pull request build never queues behind or blocks a deploy of
  # main. Superseded pull request builds are cancelled; deploys never are.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          # Repo is served at https://<owner>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Point the built site at your deployed backend API.
          # Update this once the backend is hosted (e.g. Railway/Render).
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api' }}
          # Stamped onto <div class="cm-root" data-build="..."> so the live page
          # can be matched to the commit it was built from.
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "Stamp in built HTML: $(grep -o 'data-build="[^"]*"' out/index.html | head -1)"
          status=0
          while IFS= read -r needle; do
            if grep -qF -- "$needle" out/index.html; then
              echo "ok       $needle"
            else
              echo "MISSING  $needle"
              status=1
            fi
          done <<'NEEDLES'
          .cm-root .cm-form__submit
          cm-form__submit-label{color:#FFFFFF!important
          class="cm-form__submit-label"
          class="cm-pre__mark"
          /assets/logo/clarus-magnus-logo.png
          .cm-about__para .accent
          .cm-why-mag__shots
          .cm-why-mag__shot img{display:block
          NEEDLES
          # The homepage shows a capped roster with a link out; the full roster
          # and the filter rail live on /doctors, so check each page for what
          # belongs on it. The export path depends on the trailingSlash setting,
          # so resolve it rather than assuming either shape.
          doc_html=""
          for candidate in out/doctors.html out/doctors/index.html; do
            if [ -f "$candidate" ]; then
              doc_html="$candidate"
              break
            fi
          done
          if [ -z "$doc_html" ]; then
            echo "MISSING  doctors page was not exported"
            ls -1 out | head -30
            status=1
          else
            echo "doctors page: $doc_html"
            while IFS= read -r needle; do
              if grep -qF -- "$needle" "$doc_html"; then
                echo "ok       [doctors] $needle"
              else
                echo "MISSING  [doctors] $needle"
                status=1
              fi
            done <<'DOCTOR_NEEDLES'
          class="cm-docfilter__rail"
          class="cm-docchip
          cm-team cm-team--page
          DOCTOR_NEEDLES
            # Every consultant must be on this page, not just the homepage six.
            # Split on tags first: grep -c counts matching lines, and the export
            # is effectively one long line. "|| true" keeps a zero count from
            # tripping errexit via pipefail.
            doc_count=$(tr '<' '\n' < "$doc_html" | grep -c 'class="cm-doc__name"' || true)
            echo "doctors rendered on /doctors: $doc_count"
            if [ "$doc_count" -lt 20 ]; then
              echo "MISSING  /doctors is capped, expected the full roster"
              status=1
            fi
          fi
          home_count=$(tr '<' '\n' < out/index.html | grep -c 'class="cm-doc__name"' || true)
          echo "doctors rendered on the homepage: $home_count"
          if [ "$home_count" -eq 0 ] || [ "$home_count" -gt 8 ]; then
            echo "MISSING  homepage roster should be a small capped set"
            status=1
          fi
          if grep -qF 'class="cm-team__more"' out/index.html; then
            echo "ok       homepage view-all link"
          else
            echo "MISSING  homepage view-all link"
            status=1
          fi
          if grep -qF 'class="cm-docfilter__rail"' out/index.html; then
            echo "MISSING  (unexpected) filter rail is on the homepage"
            status=1
          else
            echo "ok       no filter rail on the homepage"
          fi
          # The template's DNA glyph must not come back anywhere on the page.
          if grep -qF 'M15.0223 1.46977' out/index.html; then
            echo "MISSING  (unexpected) template DNA glyph is still in the page"
            status=1
          else
            echo "ok       no template DNA glyph"
          fi
          exit "$status"

      # Everything below publishes, so it is skipped for pull requests — there a
      # green build and a passing verify step are the whole point.
      - name: Add .nojekyll
        if: github.event_name != 'pull_request'
        run: touch frontend/out/.nojekyll

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
